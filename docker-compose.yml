name: agent-neo-dev

services:
  db:
    image: mariadb:10.11
    container_name: agent-neo-db
    environment:
      MARIADB_DATABASE: agent_neo
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  wordpress:
    image: wordpress:6.9.4-php8.3-apache
    container_name: agent-neo-wp
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8086:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: agent_neo
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('SCRIPT_DEBUG', true);
        define('WP_ENVIRONMENT_TYPE', 'development');
    volumes:
      - wp_core:/var/www/html
      - ./themes:/var/www/html/wp-content/themes/agent-neo-themes
      - ./plugins:/var/www/html/wp-content/plugins/agent-neo-plugins
      - ../seo-tool/v2/plugin:/var/www/html/wp-content/plugins/seo-tool-connector:ro
      # 第三者テーマ（解析対象）の mount 先は .env で与える（.env.example 参照）
      - ${THEME_B_PARENT_DIR:-./vendor-themes/theme-b}:/var/www/html/wp-content/themes/${THEME_B_SLUG:-theme-b}:ro
      - ${THEME_B_CHILD_DIR:-./vendor-themes/theme-b-child}:/var/www/html/wp-content/themes/${THEME_B_SLUG:-theme-b}_child:ro
      - ${THEME_A_PARENT_DIR:-./vendor-themes/theme-a}:/var/www/html/wp-content/themes/${THEME_A_SLUG:-theme-a}
      - ${THEME_A_CHILD_DIR:-./vendor-themes/theme-a-child}:/var/www/html/wp-content/themes/${THEME_A_SLUG:-theme-a}-child:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  wpcli:
    image: wordpress:cli-php8.3
    container_name: agent-neo-cli
    depends_on:
      - wordpress
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: agent_neo
      WP_CLI_CACHE_DIR: /tmp/host/wp-cli-cache
    volumes:
      - wp_core:/var/www/html
      - ./themes:/var/www/html/wp-content/themes/agent-neo-themes
      - ./plugins:/var/www/html/wp-content/plugins/agent-neo-plugins
      - ../seo-tool/v2/plugin:/var/www/html/wp-content/plugins/seo-tool-connector:ro
      # 第三者テーマ（解析対象）の mount 先は .env で与える（.env.example 参照）
      - ${THEME_B_PARENT_DIR:-./vendor-themes/theme-b}:/var/www/html/wp-content/themes/${THEME_B_SLUG:-theme-b}:ro
      - ${THEME_B_CHILD_DIR:-./vendor-themes/theme-b-child}:/var/www/html/wp-content/themes/${THEME_B_SLUG:-theme-b}_child:ro
      - ${THEME_A_PARENT_DIR:-./vendor-themes/theme-a}:/var/www/html/wp-content/themes/${THEME_A_SLUG:-theme-a}
      - ${THEME_A_CHILD_DIR:-./vendor-themes/theme-a-child}:/var/www/html/wp-content/themes/${THEME_A_SLUG:-theme-a}-child:ro
      - ./tmp:/tmp/host
    user: "33:33"
    entrypoint: ["wp"]
    command: ["--info"]

volumes:
  db_data:
  wp_core:
