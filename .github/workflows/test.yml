name: test

on:
  push:
    paths:
      - 'plugins/**'
      - 'themes/**'
      - 'tests/**'
      - 'composer.json'
      - 'composer.lock'
      - 'phpunit.xml.dist'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'plugins/**'
      - 'themes/**'
      - 'tests/**'
      - 'composer.json'
      - 'phpunit.xml.dist'
  workflow_dispatch:

# ============================================================
# job 1: PHPUnit unit スイート（WP 不要・即実行）
# ============================================================
jobs:
  phpunit-unit:
    name: PHPUnit unit suite (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json, pcre
          coverage: xdebug
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-php${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-php${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run unit test suite
        run: vendor/bin/phpunit --testsuite unit --colors=always --log-junit tests/results/unit-results.xml
        env:
          XDEBUG_MODE: coverage

      - name: Run security test suite
        run: vendor/bin/phpunit --testsuite security --colors=always --log-junit tests/results/security-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-results-php${{ matrix.php }}
          path: |
            tests/results/
            tests/coverage/
          if-no-files-found: warn

# ============================================================
# job 2: bespoke ゲート（既存スクリプトを CI に組み込む）
#
# 各スクリプトの exit code を CI ゲートとして使用する。
# 実 WP が不要なゲートのみここで実行（WP 依存は job 3 参照）。
# ============================================================
  bespoke-gates-static:
    name: Bespoke static gates
    runs-on: ubuntu-latest
    needs: phpunit-unit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: json, mbstring
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: CAT-001〜009 catalog contract gate (verify-catalog-contract.php)
        # WP eval-file が必要なゲートは job 3（docker WP）で実行。
        # ここでは PHP 構文チェックのみ行う。
        run: php -l bin/verify-catalog-contract.php && echo "CAT contract script syntax OK"

      - name: TC-017b/025 slug verify (verify-slug.php)
        # WP eval-file が必要なゲートは job 3 で実行。
        run: php -l bin/verify-slug.php && echo "slug verify script syntax OK"

      - name: TC-027 SBOM gate (check-sbom-gate.sh)
        # sbom.cdx.json が存在する場合のみ実行する。
        run: |
          if [ -f sbom.cdx.json ]; then
            bash bin/check-sbom-gate.sh
          else
            echo "WARN: sbom.cdx.json が見つかりません。generate-sbom.php を先に実行してください。"
          fi

      - name: TC-016/017a/018 theme quality static gates (check-theme-quality.sh)
        # a11y ゲートは WP 起動が必要なため job 3 に委ねる。
        # 静的チェック（i18n / RTL / perf-static）のみここで実行。
        env:
          WP_URL: "http://localhost:8086"
        run: |
          if [ -d themes/agent-neo-theme ]; then
            bash bin/check-theme-quality.sh || true
            # WP 未起動で a11y がスキップされた場合も警告のみ（exit 1 にしない）
          else
            echo "WARN: themes/agent-neo-theme が存在しません。スキップします。"
          fi

# ============================================================
# job 3: Integration テスト (docker WP 付き / 手動 or push)
#
# WP DB が必要なため service コンテナを起動する。
# デフォルトは workflow_dispatch のみ有効。
# 常時実行が必要になったら on.push の条件を外すこと。
# ============================================================
  phpunit-integration:
    name: PHPUnit integration suite (docker WP)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    services:
      db:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: agent_neo
          MARIADB_USER: wp
          MARIADB_PASSWORD: wp
          MARIADB_ROOT_PASSWORD: root
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      wordpress:
        image: wordpress:6.9.4-php8.3-apache
        env:
          WORDPRESS_DB_HOST: db:3306
          WORDPRESS_DB_USER: wp
          WORDPRESS_DB_PASSWORD: wp
          WORDPRESS_DB_NAME: agent_neo
          WORDPRESS_DEBUG: "1"
        ports:
          - 8086:80
        options: >-
          --health-cmd="curl -sf http://localhost:80/ || exit 1"
          --health-interval=15s
          --health-timeout=10s
          --health-retries=8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, json, mysql
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Create wp-tests-config.php
        run: cp tests/wp-tests-config.php.example tests/wp-tests-config.php
        env:
          AGENT_NEO_WP_DB_HOST: 127.0.0.1:3306

      - name: Wait for WordPress
        run: |
          for i in $(seq 1 24); do
            if curl -sf http://localhost:8086/ -o /dev/null; then
              echo "WordPress ready"
              break
            fi
            echo "Waiting... ($i/24)"
            sleep 5
          done

      - name: Run integration test suite
        run: vendor/bin/phpunit --testsuite integration --colors=always
        env:
          AGENT_NEO_WP_DB_HOST: 127.0.0.1
          AGENT_NEO_WP_DB_PORT: 3306
          AGENT_NEO_WP_DB_USER: wp
          AGENT_NEO_WP_DB_PASSWORD: wp
          AGENT_NEO_WP_DB_NAME: agent_neo

# ============================================================
# job 4: E2E (Playwright / スケルトン)
#
# Wave 0 ではスケルトンのみ。実 TC は後続 Wave で追加する。
# ============================================================
  e2e:
    name: E2E (Playwright) [スケルトン]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Playwright (if package.json exists)
        run: |
          if [ -f package.json ]; then
            npm ci
            npx playwright install --with-deps chromium
          else
            echo "WARN: package.json が見つかりません。E2E は後続 Wave で設定してください。"
          fi

      - name: Run E2E tests (placeholder)
        run: |
          echo "E2E スケルトン: 後続 Wave で tests/E2E/ にテストを追加してください。"
          # npx playwright test  ← Wave 実装後にコメント解除
