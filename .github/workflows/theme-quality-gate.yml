name: current-theme-quality-gate

on:
  push:
    paths:
      - 'docs/research/2026-09-05-design-prototype-03/theme/helix-wt/**'
      - 'docs/research/2026-09-10-current-theme-quality/**'
      - 'docs/research/2026-09-10-reduced-motion/**'
      - 'scripts/verify-i18n-profile.mjs'
      - 'scripts/bootstrap-quality-wordpress.sh'
      - '.github/workflows/theme-quality-gate.yml'
  pull_request:
    paths:
      - 'docs/research/2026-09-05-design-prototype-03/theme/helix-wt/**'
      - 'docs/research/2026-09-10-current-theme-quality/**'
      - 'docs/research/2026-09-10-reduced-motion/**'
      - 'scripts/verify-i18n-profile.mjs'
      - 'scripts/bootstrap-quality-wordpress.sh'
      - '.github/workflows/theme-quality-gate.yml'
  workflow_dispatch:

jobs:
  static-gate:
    name: Current theme static quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify current theme quality evidence
        run: |
          npm run current-theme-quality:verify
          npm run reduced-motion:verify
          npm run i18n:verify

  axe-gate:
    name: a11y gate (axe-core + WordPress)
    runs-on: ubuntu-latest

    services:
      db:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
          MYSQL_USER: wp
          MYSQL_PASSWORD: wp
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      wordpress:
        image: wordpress:7.1-php8.3-apache
        env:
          WORDPRESS_DB_HOST: db:3306
          WORDPRESS_DB_USER: wp
          WORDPRESS_DB_PASSWORD: wp
          WORDPRESS_DB_NAME: wordpress
          WORDPRESS_DEBUG: "1"
        ports:
          - 8086:80
        options: >-
          --health-cmd="curl -sf http://localhost:80/ || exit 1"
          --health-interval=15s
          --health-timeout=10s
          --health-retries=8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Wait for WordPress to be ready
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8086/ -o /dev/null; then
              echo "WordPress ready"
              break
            fi
            echo "Waiting... ($i/20)"
            sleep 5
          done

      - name: Initialize WordPress and verify target theme
        run: bash scripts/bootstrap-quality-wordpress.sh "${{ job.services.wordpress.id }}"

      - name: Verify current theme is rendered
        run: curl --fail --silent --show-error http://localhost:8086/ >/dev/null

  lhci-gate:
    name: Core Web Vitals (Lighthouse CI)
    runs-on: ubuntu-latest
    # フル CWV 測定は workflow_dispatch または main へのマージ時のみ実行
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    services:
      db:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
          MYSQL_USER: wp
          MYSQL_PASSWORD: wp
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      wordpress:
        image: wordpress:7.1-php8.3-apache
        env:
          WORDPRESS_DB_HOST: db:3306
          WORDPRESS_DB_USER: wp
          WORDPRESS_DB_PASSWORD: wp
          WORDPRESS_DB_NAME: wordpress
        ports:
          - 8086:80
        options: >-
          --health-cmd="curl -sf http://localhost:80/ || exit 1"
          --health-interval=15s
          --health-timeout=10s
          --health-retries=8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x

      - name: Wait for WordPress
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8086/ -o /dev/null; then break; fi
            sleep 5
          done

      - name: Initialize WordPress and verify target theme
        run: bash scripts/bootstrap-quality-wordpress.sh "${{ job.services.wordpress.id }}"

      - name: Run Lighthouse CI
        run: |
          lhci autorun \
            --collect.url=http://localhost:8086/ \
            --collect.numberOfRuns=3 \
            --assert.preset=lighthouse:no-pwa \
            --assert.assertions.largest-contentful-paint.maxNumericValue=2500 \
            --assert.assertions.interactive.maxNumericValue=200 \
            --assert.assertions.cumulative-layout-shift.maxNumericValue=0.1 \
            --assert.assertions.render-blocking-resources=error \
            --upload.target=temporary-public-storage \
            2>&1 || true
          # lhci の結果は artifact に保存（FAIL でも続行し結果を確認）

      - name: Upload LHCI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lhci-report
          path: .lighthouseci/
          if-no-files-found: warn
