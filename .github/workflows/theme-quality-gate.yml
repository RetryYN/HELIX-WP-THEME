name: current-theme-quality-gate

on:
  push:
    paths:
      - 'docs/research/2026-09-05-design-prototype-03/theme/helix-wt/**'
      - 'docs/research/2026-09-10-current-theme-quality/**'
      - 'docs/research/2026-09-10-reduced-motion/**'
      - '.lighthouserc.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/verify-i18n-profile.mjs'
      - 'scripts/**/*.mjs'
      - 'scripts/**/*.js'
      - 'scripts/**/*.cjs'
      - 'scripts/**/*.py'
      - 'docs/research/**/*.mjs'
      - 'docs/research/**/*.js'
      - 'docs/research/**/*.cjs'
      - 'docs/research/**/*.py'
      - 'tests/lighthouse-ci-contract.test.mjs'
      - 'tests/current-theme-quality-regression.test.mjs'
      - 'tests/a11y-gate-contract.test.mjs'
      - 'scripts/bootstrap-quality-wordpress.sh'
      - '.github/workflows/theme-quality-gate.yml'
  pull_request:
    paths:
      - 'docs/research/2026-09-05-design-prototype-03/theme/helix-wt/**'
      - 'docs/research/2026-09-10-current-theme-quality/**'
      - 'docs/research/2026-09-10-reduced-motion/**'
      - '.lighthouserc.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/verify-i18n-profile.mjs'
      - 'scripts/**/*.mjs'
      - 'scripts/**/*.js'
      - 'scripts/**/*.cjs'
      - 'scripts/**/*.py'
      - 'docs/research/**/*.mjs'
      - 'docs/research/**/*.js'
      - 'docs/research/**/*.cjs'
      - 'docs/research/**/*.py'
      - 'tests/lighthouse-ci-contract.test.mjs'
      - 'tests/current-theme-quality-regression.test.mjs'
      - 'tests/a11y-gate-contract.test.mjs'
      - 'scripts/bootstrap-quality-wordpress.sh'
      - '.github/workflows/theme-quality-gate.yml'
  workflow_dispatch:

jobs:
  static-gate:
    name: Current theme static quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify current theme quality evidence bindings
        run: |
          npm run test:quality-contracts
          node scripts/audit-catalog-evidence.mjs
          npm run i18n:verify

  axe-gate:
    name: a11y gate (axe-core + WordPress)
    runs-on: ubuntu-latest

    services:
      db:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
          MYSQL_USER: wp
          MYSQL_PASSWORD: wp
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      wordpress:
        image: wordpress:7.1-php8.3-apache
        env:
          WORDPRESS_DB_HOST: db:3306
          WORDPRESS_DB_USER: wp
          WORDPRESS_DB_PASSWORD: wp
          WORDPRESS_DB_NAME: wordpress
          WORDPRESS_DEBUG: "1"
        ports:
          - 8086:80
        options: >-
          --health-cmd="curl -sf http://localhost:80/ || exit 1"
          --health-interval=15s
          --health-timeout=10s
          --health-retries=8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies and browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Wait for WordPress to be ready
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8086/ -o /dev/null; then
              echo "WordPress ready"
              break
            fi
            echo "Waiting... ($i/20)"
            sleep 5
          done

      - name: Initialize WordPress and verify target theme
        id: theme-setup
        run: bash scripts/bootstrap-quality-wordpress.sh "${{ job.services.wordpress.id }}"

      - name: Verify WCAG axe rules and mobile reflow
        env:
          A11Y_BASE_URL: http://localhost:8086
          A11Y_REPORT_PATH: ${{ runner.temp }}/a11y-positive.json
        run: node scripts/verify-a11y.mjs

      - name: Verify one-violation negative control fails closed
        if: always() && steps.theme-setup.outcome == 'success'
        env:
          A11Y_BASE_URL: http://localhost:8086
          A11Y_REPORT_PATH: ${{ runner.temp }}/a11y-negative-control.json
        run: |
          set +e
          node scripts/verify-a11y.mjs --negative-control
          result=$?
          set -e
          if [ "$result" -ne 2 ]; then
            echo "Expected the injected axe violation to produce exit 2, got $result" >&2
            exit 1
          fi

      - name: Upload accessibility reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-axe-reports
          path: ${{ runner.temp }}/a11y-*.json
          if-no-files-found: warn

  lhci-gate:
    name: Core Web Vitals (Lighthouse CI)
    runs-on: ubuntu-latest
    # PRでも測定し、merge前に判定設定と失敗伝播を検証する。
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    services:
      db:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
          MYSQL_USER: wp
          MYSQL_PASSWORD: wp
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      wordpress:
        image: wordpress:7.1-php8.3-apache
        env:
          WORDPRESS_DB_HOST: db:3306
          WORDPRESS_DB_USER: wp
          WORDPRESS_DB_PASSWORD: wp
          WORDPRESS_DB_NAME: wordpress
        ports:
          - 8086:80
        options: >-
          --health-cmd="curl -sf http://localhost:80/ || exit 1"
          --health-interval=15s
          --health-timeout=10s
          --health-retries=8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x

      - name: Wait for WordPress
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8086/ -o /dev/null; then break; fi
            sleep 5
          done

      - name: Initialize WordPress and verify target theme
        run: bash scripts/bootstrap-quality-wordpress.sh "${{ job.services.wordpress.id }}"

      - name: Run Lighthouse CI
        # LCP's 2.5s budget remains a warning pending diagnosis in issue #352; TBT is a lab proxy, not field INP.
        run: lhci autorun --config=./.lighthouserc.json

      - name: Upload LHCI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lhci-report
          path: .lighthouseci/
          if-no-files-found: error
          include-hidden-files: true
