# gate-checks.yaml — matrix compile generated
# helix_template_version: 3

# G1.5 必要十分性検証ゲート（NSRM）
# 役割: L1 要件が必要十分条件を満たすことを保証
# 参照: .helix/nsrm.yaml + docs/requirements/nsrm-*.md
G1.5:
  name: "必要十分性検証ゲート（NSRM）"
  static:
    - name: "nsrm.yaml が存在する"
      cmd: "test -f .helix/nsrm.yaml"
    - name: "ゴール一覧が空でない"
      cmd: "python3 -c \"import yaml; d=yaml.safe_load(open('.helix/nsrm.yaml')); g=d.get('goals') or []; assert len(g)>=10, f'goals too few: {len(g)}'\" 2>&1"
    - name: "孤児 REQ が 0 件"
      cmd: "python3 -c \"import yaml; d=yaml.safe_load(open('.helix/nsrm.yaml')); m=d.get('metrics',{}); assert m.get('orphan_req_count',999)==0, f\\\"orphan REQ: {m.get('orphan_req_count')}\\\"\" 2>&1"
    - name: "孤児ゴールが 0 件"
      cmd: "python3 -c \"import yaml; d=yaml.safe_load(open('.helix/nsrm.yaml')); m=d.get('metrics',{}); assert m.get('orphan_goal_count',999)==0, f\\\"orphan goal: {m.get('orphan_goal_count')}\\\"\" 2>&1"
    - name: "necessity_proof 未記入の REQ が 0 件"
      cmd: "python3 -c \"import yaml; d=yaml.safe_load(open('.helix/nsrm.yaml')); m=d.get('metrics',{}); assert m.get('reqs_without_necessity_proof',999)==0, f\\\"REQ without proof: {m.get('reqs_without_necessity_proof')}\\\"\" 2>&1"
    - name: "sufficiency_chain 未記入のゴールが 0 件"
      cmd: "python3 -c \"import yaml; d=yaml.safe_load(open('.helix/nsrm.yaml')); m=d.get('metrics',{}); assert m.get('goals_without_sufficiency_chain',999)==0, f\\\"goal without chain: {m.get('goals_without_sufficiency_chain')}\\\"\" 2>&1"
    - name: "Phase 未割当 REQ が 0 件"
      cmd: "python3 -c \"import yaml; d=yaml.safe_load(open('.helix/nsrm.yaml')); m=d.get('metrics',{}); assert m.get('unassigned_phase_count',999)==0, f\\\"unassigned phase: {m.get('unassigned_phase_count')}\\\"\" 2>&1"
    - name: "否定境界（NEG-***）が文書化されている"
      cmd: "python3 -c \"import yaml; d=yaml.safe_load(open('.helix/nsrm.yaml')); n=d.get('negation_boundaries') or []; assert len(n)>=10, f'negation boundaries too few: {len(n)}'\" 2>&1"
    - name: "Phase 1 MVP が定義されている"
      cmd: "python3 -c \"import yaml; d=yaml.safe_load(open('.helix/nsrm.yaml')); p=d.get('phase_assignments',{}).get('phase_1_mvp') or []; assert len(p)>=5, f'phase_1_mvp too few: {len(p)}'\" 2>&1"
    - name: "NSRM 詳細ドキュメント存在"
      cmd: "test -f docs/requirements/nsrm-01-goals-coverage.md && test -f docs/requirements/nsrm-05-necessity-proofs.md"
  ai:
    - name: "PM レビュー: 想定ゴールが企画書（L0）と整合"
      description: "ゴール体系が L0 の第一原理・製品哲学・差別化要素を漏れなく反映しているか"
    - name: "PM レビュー: 否定境界の過不足"
      description: "「やらない」と表明している領域が過剰でも過小でもないか"
    - name: "PM レビュー: Phase 1 MVP の最小性"
      description: "Phase 1 で削れる要件がないか、Phase 2 に送れない P0 要件がないか"

G4:
  name: "実装凍結ゲート"
  static:
    - name: "技術負債台帳の存在"
      cmd: "test -f .helix/debt-register.yaml || echo 'SKIP: 負債台帳なし（helix debt add で作成）'"
    - name: "要件→実装マッピング存在（あれば）"
      cmd: "python3 -c \"import sqlite3,sys; c=sqlite3.connect('.helix/helix.db'); r=c.execute('SELECT COUNT(*) FROM requirements').fetchone()[0]; m=c.execute('SELECT COUNT(*) FROM req_impl_map').fetchone()[0]; print(f'REQ:{r} MAP:{m}'); sys.exit(0 if r==0 or m>=r else 1)\" 2>/dev/null || echo 'SKIP: 要件テーブルなし'"
    - name: "API エンドポイント整合チェック"
      cmd: "$HELIX_HOME/cli/helix-gate-api-check"
    - name: "テストカバレッジ（あれば）"
      cmd: "if [ -f coverage/coverage-summary.json ]; then python3 -c \"import json; d=json.load(open('coverage/coverage-summary.json')); pct=d.get('total',{}).get('lines',{}).get('pct',0); exit(0 if pct>=70 else 1)\"; elif [ -f .coverage ]; then echo 'coverage exists'; else echo 'SKIP: カバレッジ未計測'; fi"
    - name: "モック/ダミー残存チェック"
      cmd: "! rg -n '(?i)(localhost:[0-9]|mock-api|dummy-data|FIXME|TODO.*mock)' src/ --type ts --type js --type tsx --type jsx 2>/dev/null | grep -v '.*\\.test\\.' | grep -v '.*\\.spec\\.' | head -1"
    - name: "console.log/debugger 残存チェック"
      cmd: "! rg -n '^\\s*(console\\.(log|debug|warn|error)|debugger)' src/ --type ts --type js --type tsx --type jsx 2>/dev/null | grep -v '.*\\.test\\.' | grep -v '.*\\.spec\\.' | head -1"
    - name: "開発用語の UI 露出チェック"
      cmd: "! rg -n '(Exception|NullPointerException|undefined is not|Cannot read prop|Stack trace|Error:.*at )' src/ --type ts --type js --type tsx --type jsx 2>/dev/null | grep -v 'catch\\|throw\\|Error(' | head -1"
    - name: "AI っぽい出力チェック"
      cmd: "! rg -n '(もちろんです|お手伝いします|ご質問にお答えします|As an AI|I apologize)' src/ --type ts --type js --type tsx --type jsx 2>/dev/null | head -1"
    - name: "ハードコード URL チェック"
      cmd: "! rg -n 'https?://(localhost|127\\.0\\.0\\.1|0\\.0\\.0\\.0)' src/ --type ts --type js --type tsx --type jsx 2>/dev/null | grep -v '.*\\.test\\.' | grep -v 'env\\.' | head -1"
    - name: "CSS マジックナンバーチェック"
      cmd: "! rg -n 'z-index:\\s*[0-9]{3,}' src/ --type css 2>/dev/null | head -1"
  ai: []
