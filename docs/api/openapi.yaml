openapi: 3.1.0
info:
  title: AGENT NEO API
  version: 0.1.0-L3
  description: |
    正本=api-catalog.md。本書は L3 API 契約凍結の機械可読版

    ## ライセンス縮退応答（横断ポリシー / TB-18a）

    ライセンス縮退応答（403 FEATURE_DISABLED / 503 LICENSE_GRACE_PERIOD）は**全法人スコープ write endpoint に適用される横断的応答**。
    個人スコープ（記事 CRUD: POST /posts・PATCH /posts/{id} 等）は grace 中も継続可能であり、縮退対象外。

    | コード | モード | 条件 | 意味 |
    |--------|--------|------|------|
    | 403 FEATURE_DISABLED | invalid（即時 deny） | ライセンスキー無効・失効が確定 | 法人版機能を無効化し個人版スコープに縮退。deny-first |
    | 503 LICENSE_GRACE_PERIOD | transient（grace 中） | ライセンスサーバ到達不能・502 / 3 回連続失敗 | 48h grace 中は readonly 縮退し write 系 endpoint は 503 を返す。grace 満了後は 403 に遷移 |

    法人スコープ write endpoint への per-endpoint 完全契約化は L4（carry-014）で実施。
    本書では主要な構造変更系 endpoint に 403/503 を明示し、それ以外も上記横断ポリシーが適用される旨を本 note で宣言する。
x-api-catalog:
