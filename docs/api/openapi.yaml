  note: |
    /features は catalog に 2 つ用途があるため 1 operation に集約し、x-api-catalog-entries で両系統を保持。
  x-api-catalog-entries:
    - method: GET
      path: /features
      req_code: PF-003
      usage: パッケージ別機能フラグ一覧（Health / Setup）
    - method: GET
      path: /features
      req_code: PF-003
      usage: パッケージ別機能フラグ（License / Package）
