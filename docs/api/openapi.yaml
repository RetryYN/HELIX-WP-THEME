      operationId: AF-fit-sync
      summary: safe apply readiness 同期
      tags:
        - AutomationSEO
      responses:
        '200':
          description: 同期 / apply 結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
  /automation-seo/bridge-profile:
    get:
      operationId: A-bridge-profile
      summary: Theme Bridge Plugin 互換プロファイル
      tags:
        - AutomationSEO
      responses:
        '200':
          description: |
            source/confidence 付き theme 情報（safe_apply_state enum 含む）。
            data フィールドの形状は BridgeProfile スキーマで型強制される。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/BridgeProfile'
  /risks/hazards:
    get:
      operationId: AF-risks-ledger
      summary: SEO / WP 運用 / AI 運用の risk-ledger と検出結果
      tags:
        - Risks
      responses:
        '200':
          description: ハザード一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
  /crawler-policy:
    get:
      operationId: A-crawler-policy-get
      summary: crawler access matrix 取得
      tags:
        - Risks
      responses:
        '200':
          description: crawler 別 allowed/blocked/noindex マトリクス + active preset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
    post:
      operationId: A-crawler-policy
      summary: crawler access matrix 更新
      tags:
        - Risks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - policy
              properties:
                policy:
                  type: array
                  items:
                    type: object
                    properties:
                      crawler_name:
                        type: string
                      allow:
                        type: boolean
                      reason:
                        type: string
                preset:
                  type: string
                  enum:
                    - permissive
                    - balanced
                    - restrictive
      responses:
        '200':
          description: 更新結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
  /affiliate/block:
    post:
      operationId: A-affiliate-block
      summary: 収益化ブロック生成
      tags:
        - Affiliate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - block_type
                - payload
              properties:
                block_type:
                  type: string
                  enum:
                    - review
                    - ranking
                    - comparison
                    - affiliate_cta
                    - product_card
                payload:
                  type: object
      responses:
        '200':
          description: 収益化ブロック構築結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
  /aseo/v1/agent-neo/catalog-update:
    post:
      operationId: A-catalog-update
      summary: catalog-update 通知受信（automation SEO 契約 §17）
      tags:
        - External
      security: []
      # catalog-update は automation SEO 側（aseo/v1）への送信契約。agent-neo 内部 server とは別境界。
      servers:
        - url: /wp-json/aseo/v1
          description: automation SEO 外部契約エンドポイント
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogUpdateRequest'
      responses:
        '200':
          description: >
            event_id が冪等キー（24h TTL）。retry=5xx と 429、初回 1 秒、指数 2^n、最大 5 回、各 retry ±10% jitter、4xx（429 除く）リトライ対象外。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogUpdateResponse'
        '400':
          description: schema / validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validation_error:
                  value:
                    code: VALIDATION_ERROR
                    message: catalog payload validation failed
        '401':
          description: plugin auth failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                auth_failed:
                  value:
                    code: PLUGIN_AUTH_FAILED
                    message: Authentication to plugin failed
        '409':
          description: AGENT_NEO_NOT_INSTALLED / RETRY_EXHAUSTED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_installed:
                  value:
                    code: AGENT_NEO_NOT_INSTALLED
                    message: Agent NEO plugin is not installed
                retry_exhausted:
                  value:
                    code: RETRY_EXHAUSTED
                    message: Catalog update exceeded retry limit
        '500':
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internal_error:
                  value:
                    code: INTERNAL_ERROR
                    message: Internal error (retryable)
        '429':
          description: rate limited (retryable) / RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                rate_limited:
                  value:
                    code: RATE_LIMITED
                    message: rate limited (retryable)
components:
  schemas:
    StandardResponse:
      type: object
      additionalProperties: false
      required:
        - success
      properties:
        success:
          type: boolean
          description: 処理成功フラグ
        data:
          type: object
          nullable: true
          description: 各 API の本体データ
        meta:
          type: object
          required:
            - request_id
          properties:
            request_id:
              type: string
              description: トレース用 request id
        error:
          type: object
          nullable: true
          required:
            - code
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - UNAUTHORIZED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - GONE
                - PRECONDITION_FAILED
                - RATE_LIMITED
                - FEATURE_DISABLED
                - LICENSE_GRACE_PERIOD
                - AGENT_NEO_NOT_INSTALLED
                - PLUGIN_AUTH_FAILED
                - RETRY_EXHAUSTED
                - SIGNATURE_INVALID
                - LICENSE_GATEWAY_ERROR
                - INTERNAL_ERROR
            message:
              type: string
              description: エラーメッセージ
            details:
              type: object
              additionalProperties: true
              description: 補足情報
      example:
        success: true
        data: {}
        meta:
          request_id: req_01H0... 
        error: null
    Diff:
      type: object
      description: リソース差分（RFC6902 互換）
      required:
        - operations
      properties:
        operations:
          type: array
          items:
            type: object
            required:
              - op
              - path
            properties:
              op:
                type: string
                enum:
                  - add
                  - remove
                  - replace
                  - move
                  - copy
                  - test
              path:
                type: string
              from:
                type: string
              value:
                type: object
                additionalProperties: true
              from_value:
                type: object
                additionalProperties: true
      additionalProperties: false
    RollbackPoint:
      type: object
      required:
        - rollback_id
        - created_at
      properties:
        rollback_id:
          type: string
        created_at:
          type: string
          format: date-time
        actor:
          type: string
        target:
          type: string
        scope:
          type: string
      additionalProperties: false
    CatalogUpdateRequest:
      type: object
      additionalProperties: false
      required:
        - site_hash
        - agent_neo_version
        - event_kind
        - event_id
        - occurred_at
        - payload
      properties:
        site_hash:
          type: string
          description: テナント識別子
        agent_neo_version:
          type: string
          description: Plugin B のバージョン
        event_kind:
          type: string
          enum:
            - block_registered
            - block_unregistered
            - template_updated
            - theme_token_updated
        event_id:
          type: string
          description: 冪等キー（24h TTL）
        occurred_at:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: false
          required:
            - block_name
            - template_part_slug
            - diff
          properties:
            block_name:
              type: string
            template_part_slug:
              type: string
            diff:
              $ref: '#/components/schemas/Diff'
    BridgeProfile:
      type: object
      additionalProperties: false
      description: |
        Theme Bridge Plugin 互換プロファイル（StandardResponse.data の形状）。ADR-019 準拠:
        既存テーマ（ThemeB/テーマA 等）は preview-only 固定。
        write-ready は AGENT NEO 専用テーマ環境でのみ設定される。
        GET /automation-seo/bridge-profile の 200 レスポンスは StandardResponse エンベロープに
        ラップされ、data フィールドにこのスキーマのオブジェクトが格納される。
      required:
        - theme_slug
        - safe_apply_state
      properties:
        theme_slug:
          type: string
          description: 検出されたテーマスラッグ
        theme_version:
          type: string
          description: テーマバージョン（取得可能な場合）
        safe_apply_state:
          type: string
          enum:
            - preview-only
            - write-ready
          description: |
            preview-only: 既存テーマ環境（ThemeB/テーマA 等）。block 書き込み API は無効。
            write-ready: AGENT NEO 専用テーマ環境。block 書き込み全機能有効。
        confidence:
          type: string
          enum:
            - high
            - medium
            - low
          description: テーマ検出の確信度
        source:
          type: string
          description: "プロファイル取得元（例: theme-catalog / probe）"
    CatalogUpdateResponse:
      type: object
      additionalProperties: false
      required:
        - received
        - event_id
        - deduplicated
        - next_action
      properties:
        received:
          type: boolean
        event_id:
          type: string
        deduplicated:
          type: boolean
        next_action:
          type: string
          enum:
            - scan-catalog
            - none
    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - GONE
            - PRECONDITION_FAILED
            - RATE_LIMITED
            - FEATURE_DISABLED
            - LICENSE_GRACE_PERIOD
            - AGENT_NEO_NOT_INSTALLED
            - PLUGIN_AUTH_FAILED
            - RETRY_EXHAUSTED
            - SIGNATURE_INVALID
            - LICENSE_GATEWAY_ERROR
            - INTERNAL_ERROR
        message:
          type: string
        details:
          type: object
          additionalProperties: true
  responses:
    UnauthorizedResponse:
      description: 認証失敗
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardResponse'
          example:
            success: false
            data: null
            meta:
              request_id: req-unauth
            error:
              code: UNAUTHORIZED
              message: unauthorized
    BadRequestResponse:
      description: リクエストエラー
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardResponse'
          example:
            success: false
            data: null
            meta:
              request_id: req-bad
            error:
              code: VALIDATION_ERROR
              message: invalid request
    NotFoundResponse:
      description: 対象未発見
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardResponse'
          example:
            success: false
            data: null
            meta:
              request_id: req-notfound
            error:
              code: NOT_FOUND
              message: resource not found
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: AI 操作・内部管理 API 用の認証
    public:
      type: apiKey
      in: header
      name: X-AGENT-NEO-PUBLIC
      description: "public / tracking 系は security: [] で認証不要。互換用に定義。"
